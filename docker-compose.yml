version: '3.8'

# VoLTE KPI Dashboard - Docker Compose Configuration
# ===================================================
# This file sets up the complete system with:
# - ClickHouse database
# - Python FastAPI backend
# - Vite frontend (optional)
# - Redis cache (optional)

services:
  # -----------------------------------------------------------------------------
  # ClickHouse Database
  # -----------------------------------------------------------------------------
  clickhouse:
    image: clickhouse/clickhouse-server:24.3
    container_name: volte-kpi-clickhouse
    hostname: clickhouse
    ports:
      - "8123:8123"  # HTTP API
      - "9000:9000"  # Native interface
      - "9009:9009"  # Interserver communication
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - clickhouse_log:/var/log/clickhouse
      - clickhouse_config:/etc/clickhouse-server
      - ./01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
    environment:
      - CLICKHOUSE_DB=volte_kpi
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD=
      - CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - volte-kpi-network

  # -----------------------------------------------------------------------------
  # Python FastAPI Backend
  # -----------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: server/Dockerfile
      target: production
    container_name: volte-kpi-backend
    hostname: backend
    ports:
      - "8080:8080"
    environment:
      - API_HOST=0.0.0.0
      - API_PORT=8080
      - CH_HOST=clickhouse
      - CH_PORT=8123
      - CH_DATABASE=volte_kpi
      - CH_USER=default
      - CH_PASSWORD=
      - CORS_ORIGINS=http://localhost:3000,http://localhost:8000,http://127.0.0.1:8000,http://frontend:3000
      - CACHE_TTL=300
      - SLA_ACCESS_FAIL_RATE=2.0
      - SLA_DROP_RATE=1.5
      - SLA_CELL_INTEGRITY=97.0
      - SLA_PDCCH_ERROR=3.0
      - SLA_ERLANG_PER_SECTOR=40.0
      - AUTH_ENABLED=false
    depends_on:
      clickhouse:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8080/health', timeout=5).raise_for_status()"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    networks:
      - volte-kpi-network

  # -----------------------------------------------------------------------------
  # Vite Frontend (Development)
  # -----------------------------------------------------------------------------
  frontend:
    image: node:20-alpine
    container_name: volte-kpi-frontend
    hostname: frontend
    ports:
      - "3000:3000"
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
    command: sh -c "npm install && npm run dev"
    environment:
      - NODE_ENV=development
      - VITE_API_BASE_URL=http://backend:8080
      - VITE_AUTO_REFRESH_INTERVAL=300000
    depends_on:
      - backend
    profiles:
      - dev
    networks:
      - volte-kpi-network

  # -----------------------------------------------------------------------------
  # Nginx Reverse Proxy (Production)
  # -----------------------------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: volte-kpi-nginx
    hostname: nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - backend
    profiles:
      - prod
    networks:
      - volte-kpi-network

  # -----------------------------------------------------------------------------
  # Redis Cache
  # -----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: volte-kpi-redis
    hostname: redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --requirepass your-redis-password
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    profiles:
      - cache
    networks:
      - volte-kpi-network

  # -----------------------------------------------------------------------------
  # ClickHouse Schema Init (One-time setup)
  # -----------------------------------------------------------------------------
  clickhouse-init:
    image: clickhouse/clickhouse-server:24.3
    container_name: volte-kpi-clickhouse-init
    depends_on:
      clickhouse:
        condition: service_healthy
    volumes:
      - ./01_schema.sql:/schema.sql:ro
    entrypoint: ["/bin/bash", "-c", "clickhouse-client --host clickhouse --multiquery < /schema.sql && echo 'Schema applied successfully'"]
    profiles:
      - setup
    networks:
      - volte-kpi-network

  # -----------------------------------------------------------------------------
  # Data Generator (One-time setup)
  # -----------------------------------------------------------------------------
  data-generator:
    build:
      context: .
      dockerfile: server/Dockerfile
      target: development
    container_name: volte-kpi-data-generator
    command: python 02_sample_data.py --host clickhouse --port 8123 --days 7
    depends_on:
      clickhouse-init:
        condition: service_completed_successfully
      clickhouse:
        condition: service_healthy
    volumes:
      - ./02_sample_data.py:/app/02_sample_data.py
    environment:
      - CH_HOST=clickhouse
      - CH_PORT=8123
      - CH_DATABASE=volte_kpi
    profiles:
      - setup
    networks:
      - volte-kpi-network

# -----------------------------------------------------------------------------
# Volumes
# -----------------------------------------------------------------------------
volumes:
  clickhouse_data:
  clickhouse_log:
  clickhouse_config:
  redis_data:

# -----------------------------------------------------------------------------
# Networks
# -----------------------------------------------------------------------------
networks:
  volte-kpi-network:
    driver: bridge
