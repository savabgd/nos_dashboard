# ============================================================
# NOC Dashboard — Apache VirtualHost za produkciju
# ============================================================
# GDE STAVITI OVAJ FAJL:
#   XAMPP:  C:\xampp\apache\conf\extra\nos-dashboard.conf
#           pa dodati u C:\xampp\apache\conf\httpd.conf:
#             Include conf/extra/nos-dashboard.conf
#
#   Apache Lounge (samostalni httpd):
#           C:\Apache24\conf\extra\nos-dashboard.conf
#           pa u C:\Apache24\conf\httpd.conf dodati isti Include.
#
#   Linux:  /etc/apache2/sites-available/nos-dashboard.conf
#           a2ensite nos-dashboard && systemctl reload apache2
#
# NAKON IZMENE: restart Apache (vidi APACHE.md)
# ============================================================

# ——— Potrebni moduli (otkomentarisi / uključi u httpd.conf) ———
# LoadModule rewrite_module modules/mod_rewrite.so
# LoadModule proxy_module modules/mod_proxy.so
# LoadModule proxy_http_module modules/mod_proxy_http.so
# LoadModule headers_module modules/mod_headers.so
# LoadModule expires_module modules/mod_expires.so
# LoadModule deflate_module modules/mod_deflate.so
# LoadModule proxy_wstunnel_module modules/mod_proxy_wstunnel.so  # ako koristiš WebSocket

# ——— Varijable (promeni po potrebi) ———
# Backend — FastAPI / VoLTE KPI API
Define BACKEND_URL http://127.0.0.1:8080
# Gde je buildovan frontend (dist/)
Define DOCROOT "C:/cetin/Test_plus/dist"
# Ako deployuješ u podfolder, npr. http://server/nos-dashboard/
# onda stavi: Define URL_PREFIX /nos-dashboard

<VirtualHost *:80>
    ServerName localhost
    # ServerAlias nos.cetin.local  # dodaj ako imaš DNS / hosts unos

    DocumentRoot "${DOCROOT}"

    # ——— Log ———
    ErrorLog "logs/nos-dashboard-error.log"
    CustomLog "logs/nos-dashboard-access.log" combined

    # ——— Frontend (statički fajlovi iz dist/) ———
    <Directory "${DOCROOT}">
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted

        # Ako nema .htaccess, fallback i ovde (sigurnosna mreža)
        <IfModule mod_rewrite.c>
            RewriteEngine On
            # Za podfolder deploy: RewriteBase /nos-dashboard/
            RewriteBase /

            # /api, /metrics, /health ne diraj — idu na ProxyPass
            RewriteCond %{REQUEST_URI} ^/api/ [OR]
            RewriteCond %{REQUEST_URI} ^/metrics [OR]
            RewriteCond %{REQUEST_URI} ^/health
            RewriteRule ^ - [L]

            RewriteCond %{REQUEST_FILENAME} -f [OR]
            RewriteCond %{REQUEST_FILENAME} -d
            RewriteRule ^ - [L]
            RewriteRule ^ index.html [L]
        </IfModule>
    </Directory>

    # ——— API proxy — browser zove /api/* na istom originu,
    #     Apache prosleđuje na backend (nema CORS problema) ———
    ProxyPreserveHost On
    ProxyRequests Off

    # Obični REST pozivi
    ProxyPass /api/ ${BACKEND_URL}/api/ retry=0 timeout=30
    ProxyPassReverse /api/ ${BACKEND_URL}/api/

    # SSE stream — MORA dugačak timeout + flush (inače Apache baferuje)
    <Location /api/kpis/stream>
        ProxyPass ${BACKEND_URL}/api/kpis/stream disablereuse=on flushpackets=on timeout=3600 retry=0
        ProxyPassReverse ${BACKEND_URL}/api/kpis/stream
        # Ne keširaj SSE
        Header unset Cache-Control
        Header set Cache-Control "no-cache"
        Header set Connection "keep-alive"
    </Location>

    # Opciono: health/metrics direktno sa backend-a
    ProxyPass /health ${BACKEND_URL}/health retry=0 timeout=10
    ProxyPassReverse /health ${BACKEND_URL}/health
    ProxyPass /metrics ${BACKEND_URL}/metrics retry=0 timeout=10
    ProxyPassReverse /metrics ${BACKEND_URL}/metrics

    # ——— Sigurnosni headeri (dopunjuju one iz .htaccess) ———
    <IfModule mod_headers.c>
        Header always set X-Content-Type-Options "nosniff"
        Header always set X-Frame-Options "SAMEORIGIN"
    </IfModule>
</VirtualHost>

