# ============================================================
# Minimalan snippet ako NE želiš ceo VirtualHost,
# već samo da "ubaciš" dashboard u postojeći sajt.
# Kopiraj ovo u postojeći <VirtualHost> u httpd.conf
# ili u conf/extra/httpd-vhosts.conf
# ============================================================

# 1) Uključi module (jednom, negde pri vrhu httpd.conf):
# LoadModule rewrite_module modules/mod_rewrite.so
# LoadModule proxy_module modules/mod_proxy.so
# LoadModule proxy_http_module modules/mod_proxy_http.so
# LoadModule headers_module modules/mod_headers.so
# LoadModule expires_module modules/mod_expires.so
# LoadModule deflate_module modules/mod_deflate.so

# 2) Alias — ako želiš podfolder (npr. http://server/nos-dashboard/)
#    Za root deploy (http://server/) — ne treba Alias, samo DocumentRoot.
Alias /nos-dashboard "C:/cetin/Test_plus/dist"
<Directory "C:/cetin/Test_plus/dist">
    Options -Indexes +FollowSymLinks
    AllowOverride All
    Require all granted
</Directory>

# 3) Proxy API -> backend
ProxyPreserveHost On
ProxyPass /api/ http://127.0.0.1:8080/api/ retry=0 timeout=30
ProxyPassReverse /api/ http://127.0.0.1:8080/api/
<Location /api/kpis/stream>
    ProxyPass http://127.0.0.1:8080/api/kpis/stream disablereuse=on flushpackets=on timeout=3600 retry=0
    ProxyPassReverse http://127.0.0.1:8080/api/kpis/stream
</Location>
